<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 3 - Bootstrap Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="mb-4">Contact Us</h2>

            <!-- novalidate turns off the browser bubbles, so we can show Bootstrap messages -->
            <form id="contactForm" action="#" method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="John Smith" required minlength="2">
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Name is required (at least 2 characters).</div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Email is required and must be a valid address.</div>
                    </div>
                    <div class="col-12">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="At least 10 characters" required minlength="10"></textarea>
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Message must be at least 10 characters.</div>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Send</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="js/task3.js"></script>
</body>
</html>
